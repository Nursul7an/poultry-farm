name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Knowledge seed is generated from docs/knowledge and aa-norms.json
        run: npm run gen:knowledge && git diff --exit-code -- supabase/migrations apps/web/src/api/knowledge.generated.json
      - run: npm run typecheck
      - run: npm test
      - name: Database tests (schema, RLS, edit window)
        run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end tests (offline, sync, 48 h rule)
        run: npm run test:e2e
